[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "printer-agent"
version = "0.1.0a6"
description = "Edge agent for a distributed 3D printer fleet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "aiomqtt>=2.3,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]
windows = [
  "pywin32>=306; platform_system == 'Windows'",
]
# Desktop app only. The service never imports Qt, so its runtime footprint is
# unchanged by installing this extra.
gui = [
  "PySide6-Essentials>=6.7,<7",
]

[project.scripts]
printer-agent = "printer_agent.cli:main"

# gui-scripts, not scripts: setuptools builds these against pythonw.exe, so
# launching the app never opens a console window.
[project.gui-scripts]
printer-agent-gui = "printer_agent.desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"printer_agent.desktop" = ["resources/*.ico"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "live: tests that connect to real printers on the network",
]
