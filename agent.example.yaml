# Full endpoint URL, including the agent path. A bare host reaches the site
# root and gets HTML instead of a WebSocket handshake.
hub_url: https://rd-control.example.com/api/printers/agent
agent_token: replace-me
location_key: loc-001
telemetry_interval_s: 5
heartbeat_interval_s: 15
command_reconnect_backoff_s:
  min: 1
  max: 60
outbox:
  max_events: 5000
  database_path: data/outbox.sqlite3
# Files the hub sends for printing. They have to outlive a restart — the start
# arrives as its own command after the upload — but not a shop-floor disk.
# `directory` defaults to a folder next to the outbox database.
print_files:
  max_age_h: 72
  max_total_mb: 2048
updates:
  feed_url: https://downloads.example.com/printer-agent/update.json
  # With auto_update the service installs a new version by itself and restarts,
  # waiting until no print file is being transferred and no camera session is
  # open — a running print is not a reason to wait, the printer runs it alone.
  auto_update: false
  check_on_startup: true
  # How often a running agent re-asks the feed. 0 keeps the old behaviour:
  # only at service start, which a box that stays up for weeks never reaches.
  check_interval_h: 24
printers:
  - key: printer-1
    brand: moonraker
    host: 192.168.10.21
    port: 7125
    # Only needed when the camera is not where the adapter looks by itself
    # (`http://<host>/webcam/?action=snapshot`, then `:8080/?action=snapshot`).
    # No URL and no answer to the probe means the printer reports no camera.
    camera_snapshot_url: ""
    credentials: {}
  - key: printer-2
    brand: bambu
    host: 192.168.10.22
    port: 8883
    credentials:
      access_code: replace-me
      serial: replace-me
  # Creality K-series firmware that keeps Moonraker's 7125 closed: the vendor
  # WebSocket on 9999 is the only way in, and it needs no credentials.
  - key: printer-3
    brand: creality
    host: 192.168.10.23
    port: 9999
    credentials: {}
